apiVersion: apps/v1
kind: Deployment
metadata:
  name: middleware
  namespace: neof-aws
  labels:
    app: middleware
    app.kubernetes.io/name: middleware
    app.kubernetes.io/part-of: neof-aws
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: middleware
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: middleware
        app.kubernetes.io/name: middleware
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: middleware
          image: 797336051996.dkr.ecr.eu-north-1.amazonaws.com/app:2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
