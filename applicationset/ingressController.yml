apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-shared-ingress
  namespace: argocd-aws
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.15.1       # pin an exact version once you confirm it — see note below
      helm:
        valueFiles:
          - $values/Applications/aws/applications/ingress/ingress.yaml
    - repoURL: https://github.com/Hiren205/iamaccess.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: neof-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true